<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10151d">
<title>Предметики</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{color-scheme:dark;--bg:#0c1118;--panel:#141c27;--line:#283647;--text:#eef2f7;--muted:#99a7b8;--gold:#e5c57e;--blue:#79c9ed;--green:#8ed9b0;--orange:#ffb078;--purple:#c4a5ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -25%,#27384a 0,#111a25 42%,var(--bg) 78%);color:var(--text);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}
main{max-width:1440px;margin:auto;padding:28px 28px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:21px}
.switch{display:flex;gap:7px;padding:5px;border:1px solid #2d3a4b;background:#101720;border-radius:13px;flex-wrap:wrap}
.switch button,.filter{border:0;border-radius:9px;background:transparent;color:#aebaca;padding:9px 17px;font:600 14px/1.2 Inter,Segoe UI,Arial,sans-serif;cursor:pointer;transition:.18s}
.switch button.active{background:#293747;color:#fff;box-shadow:inset 0 0 0 1px #52657a}.switch button{white-space:nowrap}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px}.search:before{content:'⌕';position:absolute;left:14px;top:7px;color:#8293a6;font-size:23px}.search input{width:100%;height:44px;padding:0 14px 0 42px;background:#121a24;border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;outline:none}.search input:focus{border-color:#7894ae}
select{height:44px;padding:0 34px 0 13px;background:#121a24;border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit}
.action{height:44px;padding:0 16px;border:1px solid #6f6045;border-radius:10px;background:#26271f;color:#f1dca9;font:650 13px/1.2 Inter,Segoe UI,Arial,sans-serif;cursor:pointer;transition:.18s;white-space:nowrap}.action:hover{background:#383528;border-color:#b89a61}.action:disabled{opacity:.55;cursor:wait}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 15px}.filter{border:1px solid #293849;background:#131c27;padding:7px 12px;font-size:12px}.filter.active{border-color:#8a7654;background:#302b21;color:#f0dba9}.filter:hover{border-color:#71879f;color:#fff}
.status{min-height:16px;margin:0 0 14px;color:#91a0b2;font-size:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.tile{position:relative;min-width:0;min-height:154px;padding:15px 11px 12px;border:1px solid #304256;border-radius:14px;background:radial-gradient(ellipse at 50% 0%,#2a3c50 0%,transparent 65%),linear-gradient(145deg,#1b2938,#101822 78%);color:var(--text);text-align:center;cursor:pointer;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s}.tile:after{content:'';position:absolute;inset:5px;border:1px solid #ffffff08;border-radius:10px;pointer-events:none}
.tile:before{content:'';position:absolute;top:0;left:18%;right:18%;height:2px;background:linear-gradient(90deg,transparent,#e1c17b,transparent);opacity:.85}.tile:hover{transform:translateY(-4px);border-color:#b0925d;box-shadow:0 13px 30px #0009,0 0 20px #b0925d17}
.tile img{display:block;width:70px;height:70px;object-fit:contain;margin:0 auto 10px;filter:drop-shadow(0 7px 12px #000a)}.tile .title{display:block;font-size:13px;font-weight:700;line-height:1.3}.tile .sub{display:block;margin-top:6px;color:#d6b979;font-size:11px;line-height:1.35}.tile.rune img{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 0 9px #9c8b642b)}
.empty{grid-column:1/-1;padding:48px 15px;text-align:center;color:#9caaba;border:1px dashed #344355;border-radius:13px}
.overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:#05080ddc;backdrop-filter:blur(8px)}.overlay.open{display:flex}
.modal{position:relative;width:min(1040px,100%);max-height:90vh;overflow:auto;border:1px solid #405268;border-radius:17px;background:linear-gradient(145deg,#1b2938,#111923 75%);box-shadow:0 25px 90px #000b}
.close{position:absolute;right:13px;top:13px;width:34px;height:34px;border:1px solid #36485d;border-radius:9px;background:#121b26;color:#dce5ef;font-size:21px;cursor:pointer}
.modal-head{display:flex;gap:19px;align-items:center;padding:25px 58px 22px 25px;border-bottom:1px solid #29394a}.modal-head img{width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 6px 12px #0008)}.modal-head h2{margin:0 0 7px;font:600 32px/1.15 Georgia,serif;color:#f5f3ee}.modal-sub{color:var(--gold);font-size:14px}.modal-body{padding:25px 32px 30px}.description{color:#e0e7ef;font-size:17px;line-height:1.85;overflow-wrap:anywhere}.description br{display:block;content:'';margin:5px 0}.description .hl-gold{color:#f2cf80;font-weight:700}.description .hl-blue{color:#85d8fa;font-weight:700}.description .hl-green{color:#97e2b3;font-weight:700}.description .hl-orange{color:#ffb17a;font-weight:700}.description .hl-purple{color:#c9adff;font-weight:700}.description .hl-muted{color:#a6b3c3;font-style:italic}.description .hl-custom{font-weight:800}.description b,.description strong{color:#fff0c9;text-shadow:0 0 12px #e5c57e25}.description li{margin-left:19px}.stats{display:flex;flex-wrap:wrap;gap:9px;margin-top:23px}.stat{display:inline-flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid #3a5268;border-radius:9px;background:linear-gradient(135deg,#1b2a39,#15212e);font-size:13px;box-shadow:inset 0 1px #ffffff08}.stat-label{color:#c4cfdb}.stat-value{font-size:15px;font-weight:800;color:#f2cf80;text-shadow:0 0 12px #e5c57e35}.modal-actions{padding:0 26px 24px}.export-status{min-height:17px;margin:0 0 12px;color:#a7b6c7;font-size:11px}
.champion-bar{display:flex;align-items:center;gap:13px;margin:4px 0 16px;padding:11px 13px;border:1px solid #34475c;border-radius:12px;background:linear-gradient(110deg,#1c2a3a,#111923)}
.champion-bar[hidden]{display:none}.champion-bar img{width:52px;height:52px;border-radius:9px;border:1px solid #5e7187}.champion-bar .champion-name{font:600 22px Georgia,serif;color:#f2f3f5}.champion-bar .champion-hint{font-size:11px;color:#9eacbd}.champion-bar .back{margin-left:auto;border:1px solid #52677e;background:#172331;color:#d8e7f5;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:650}
.tile.champion-tile img{width:86px;height:86px;border-radius:13px;border:1px solid #53687c;object-fit:cover}.tile.ability-tile img{width:78px;height:78px;border-radius:10px;border:1px solid #607488;object-fit:cover}.tile .key-badge{position:absolute;top:9px;left:10px;color:#e7d29f;font-size:10px;font-weight:800;letter-spacing:.12em}
.ability-video-wrap{position:relative;width:min(100%,960px);margin:0 auto 28px;padding:12px;border:1px solid rgba(133,177,207,.62);border-radius:19px;background:linear-gradient(145deg,#263b50 0%,#172637 48%,#101a26 100%);box-shadow:inset 0 1px rgba(255,255,255,.08),0 18px 42px rgba(0,0,0,.42);overflow:hidden;text-align:center}.ability-video-wrap:before{content:'';position:absolute;inset:6px;border:1px solid rgba(135,194,226,.2);border-radius:13px;pointer-events:none}.ability-video-wrap[hidden],.ability-stats[hidden]{display:none}.ability-video-wrap video{position:relative;z-index:1;display:block;width:100%;max-height:540px;min-height:220px;margin:0 auto;object-fit:contain;background:radial-gradient(ellipse at 50% 45%,#26394b 0%,#111b27 74%);border:1px solid rgba(137,175,202,.35);border-radius:11px;outline:0;box-shadow:inset 0 0 28px rgba(0,0,0,.32)}.ability-stats{display:flex;gap:9px;flex-wrap:wrap;margin:21px 0 0}.ability-stat{padding:8px 12px;border:0;border-radius:8px;background:linear-gradient(135deg,#1a2b3b,#13202d);min-width:125px}.ability-stat small{display:block;color:#9db0c4;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.ability-stat strong{display:block;color:#f0d08a;font-size:15px;margin-top:2px}.modal-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.modal-actions .export-status{flex:1 0 100%}
.modal.ability-mode{width:min(1120px,100%)}.modal.ability-mode .modal-head{display:block;text-align:center;padding:27px 55px 16px;border-bottom:0}.modal.ability-mode .modal-head img{display:none}.modal.ability-mode .modal-head h2{font-size:34px;margin:0 0 8px}.modal.ability-mode .modal-sub{font-size:13px;color:#9fcbe0}.modal.ability-mode .modal-body{padding:0 42px 30px}.modal.ability-mode .description{max-width:930px;margin:0 auto;color:#e5eaf0;font-size:17px;line-height:1.8}.modal.ability-mode .close{z-index:2}
@media(max-width:650px){.modal.ability-mode .modal-head{padding:21px 48px 13px 17px}.modal.ability-mode .modal-head h2{font-size:25px}.modal.ability-mode .modal-body{padding:0 17px 22px}.ability-video-wrap{margin-bottom:18px;padding:8px;border-radius:14px}.ability-video-wrap:before{inset:4px;border-radius:10px}.ability-video-wrap video{max-height:340px;min-height:160px;border-radius:8px}.modal.ability-mode .description{font-size:15px}}
@media(max-width:650px){main{padding:17px 14px 40px}.top{align-items:stretch}.switch{width:100%}.switch button{flex:1}.controls{gap:8px}.controls .action{width:100%}.grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}.tile{padding:12px 8px;min-height:145px}.tile img{width:62px;height:62px}.modal-head{padding:20px 48px 18px 17px}.modal-head img{width:72px;height:72px}.modal-head h2{font-size:22px}.modal-body{padding:18px}.modal-actions{padding:0 18px 20px}}
</style>
</head>
<body>
<main>
  <div class="top">
    <nav class="switch" id="mainTabs" aria-label="Тип контента">
      <button class="active" data-kind="items">Предметы</button>
      <button data-kind="runes">Руны</button>
      <button data-kind="spells">Заклинания</button>
      <button data-kind="champions">Чемпионы</button>
    </nav>
  </div>
  <div class="controls">
    <label class="search"><input id="search" type="search" placeholder="Поиск…" autocomplete="off"></label>
    <select id="sort" aria-label="Сортировка"><option value="name">По названию</option><option value="price-desc">Сначала дорогие</option><option value="price-asc">Сначала дешёвые</option></select>
    <button class="action" id="downloadAll">Скачать все предметы · ZIP</button>
  </div>
  <nav class="filters" id="filters" aria-label="Фильтр"></nav>
  <div id="championBar" class="champion-bar" hidden></div>
  <p class="status" id="status">Загрузка…</p>
  <section class="grid" id="grid" aria-live="polite"></section>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalName">
  <article class="modal" id="modal">
    <button class="close" id="close" aria-label="Закрыть">×</button>
    <div class="modal-head"><img id="modalIcon" alt=""><div><h2 id="modalName"></h2><div class="modal-sub" id="modalSub"></div></div></div>
    <div class="modal-body">
      <div id="modalVideoWrap" class="ability-video-wrap" hidden>
        <video id="modalVideo" controls muted autoplay playsinline loop preload="metadata"></video>
      </div>
      <div class="description" id="modalDescription"></div>
      <div id="abilityStats" class="ability-stats" hidden></div>
    </div>
    <div class="modal-actions"><p class="export-status" id="singleStatus"></p><button class="action" id="downloadOne">Скачать карточку PNG</button><button class="action" id="downloadVideo" hidden>Скачать исходное видео WebM</button><button class="action" id="downloadAbilityCard" hidden>Скачать видео-карточку WebM</button></div>
  </article>
</div>
<script>
(() => {
  const BASE='https://ddragon.leagueoflegends.com', LOCALE='ru_RU';
  const $=id=>document.getElementById(id);
  const state={kind:'items',filter:'all',items:[],runes:[],spells:[],champions:[],selectedChampion:null,championAbilities:[],championCache:new Map(),version:'',current:null};
  const statLabels={
    FlatHPPoolMod:['Здоровье',' HP','#96dfb2'],FlatMPPoolMod:['Мана',' MP','#83d7f6'],
    FlatPhysicalDamageMod:['Сила атаки','','#ffad78'],PercentAttackSpeedMod:['Скорость атаки','%','#83d7f6'],
    FlatArmorMod:['Броня','','#83d7f6'],FlatSpellBlockMod:['Сопротивление магии','','#c2a0ff'],
    FlatCritChanceMod:['Шанс крит. удара','%','#f1ce7f'],PercentMovementSpeedMod:['Скорость передвижения','%','#83d7f6'],
    FlatMovementSpeedMod:['Скорость передвижения','','#83d7f6'],PercentLifeStealMod:['Вампиризм','%','#96dfb2'],PercentHPPoolMod:['Здоровье','%','#96dfb2']
  };
  const categories=[['all','Все'],['attack','Атака'],['magic','Магия'],['defense','Защита'],['movement','Передвижение'],['consumable','Расходники']];
  const spellCategories=[['all','Все заклинания'],['movement','Передвижение'],['defense','Защита'],['combat','Атака'],['jungle','Лес']];
  // Только заклинания призывателя, используемые в классическом Ущелье призывателей.
  const CLASSIC_SPELL_IDS=new Set(['SummonerBarrier','SummonerBoost','SummonerDot','SummonerExhaust','SummonerFlash','SummonerHaste','SummonerHeal','SummonerSmite','SummonerTeleport']);
  const tagColors={stats:'blue',attention:'gold',active:'orange',passive:'green',rules:'muted',speed:'blue',physicaldamage:'orange',magicdamage:'purple',truedamage:'orange',healing:'green',shield:'blue',scalead:'orange',scaleap:'purple',statgood:'green',scalelevel:'gold',status:'gold',keywordmajor:'gold',keywordminor:'purple',spellname:'gold',scalearmor:'blue',scalemr:'purple'};
  function itemCategory(item){const t=item.tags||[];if(t.includes('Boots'))return'movement';if(t.includes('Consumable')||t.includes('Trinket'))return'consumable';if(t.some(x=>['SpellDamage','Mana','ManaRegen'].includes(x)))return'magic';if(t.some(x=>['Health','HealthRegen','Armor','SpellBlock'].includes(x)))return'defense';if(t.some(x=>['Damage','CriticalStrike','AttackSpeed','LifeSteal'].includes(x)))return'attack';return'all'}
  // В Data Dragon рядом с обычными предметами могут встречаться варианты для других режимов,
  // скрытые предметы и служебные копии. Поле inStore по умолчанию часто не указано,
  // поэтому отбрасываем только явное false и оставляем магазинные предметы Ущелья.
  function isCurrentRiftItem(item){
    const id=String(item.__id||'');
    if(/^(22|32)\d{4}$/.test(id))return false; // дополнительные ID Arena/ARAM/Swarm
    return item.maps?.['11']===true && item.gold?.purchasable===true &&
      item.inStore!==false && !item.hideFromAll && !item.requiredChampion &&
      Boolean(item.name?.trim()) && Boolean(item.image?.full);
  }
  function normalizedItemName(name){return String(name||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase('ru')}
  function itemPriority(item){
    let score=0;
    if(item.inStore===true)score+=1000;
    if(item.maps?.['11']===true)score+=500;
    if(item.gold?.purchasable===true)score+=300;
    if(!item.hideFromAll)score+=100;
    if(!item.requiredChampion)score+=30;
    if(!item.requiredAlly)score+=20;
    if(item.image?.full)score+=10;
    return score;
  }
  function uniqueItems(list){
    const byName=new Map();
    for(const item of list){
      const key=normalizedItemName(item.name);if(!key)continue;
      const old=byName.get(key);
      if(!old || itemPriority(item)>itemPriority(old) ||
        (itemPriority(item)===itemPriority(old) && Number(item.__id)<Number(old.__id))){byName.set(key,item)}
    }
    return [...byName.values()].sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  }
  function itemStats(item){const out=[];Object.entries(item.stats||{}).forEach(([key,value])=>{const def=statLabels[key];if(!def||!Number(value))return;let n=Number(value);if(key.startsWith('Percent'))n*=100;out.push({label:def[0],value:`${n>=0?'+':''}${Number(n.toFixed(1))}${def[1]}`,color:def[2]})});return out}
  function colorClass(node){const tag=(node.tagName||'').toLowerCase();if(tag==='font'){const c=node.getAttribute('color')||'';if(/^#[0-9a-f]{3,8}$/i.test(c))return 'custom:'+c}return tagColors[tag]||''}
  function normalizeDescription(html){
    const source=String(html||'Описание отсутствует.');
    const verbs='наносят|наносит|наносил(?:а|о)?|наносили|нанесут|нанесёт|нанесет|нанёс|нанесла';
    const tags='(?:<[^>]+>\s*)*', closes='(?:\s*<\/[^>]+>)*';
    const re=new RegExp(`(${verbs})\\s*${tags}0${closes}\\s*(?:(?:<[^>]+>\\s*)*(?:ед\\.?|единиц(?:ы)?)${closes}\\s*)?${tags}(магического|физического|истинного)${closes}\\s*урона`,'giu');
    const adjectives={магического:['magicDamage','магический'],физического:['physicalDamage','физический'],истинного:['trueDamage','истинный']};
    return source.replace(re,(_match,verb,kind)=>`${verb} <${adjectives[kind.toLowerCase()][0]}>${adjectives[kind.toLowerCase()][1]} урон</${adjectives[kind.toLowerCase()][0]}>`);
  }
  function automaticHighlight(text){
    const re=/(\d+(?:[.,]\d+)?\s*(?:%|сек\.?|секунд[\p{L}]*|ед\.?)?|(?:магическ|физическ|истинн)[\p{L}]*\s+урон[\p{L}]*|скорост[\p{L}]*\s+(?:передвижен[\p{L}]*|атак[\p{L}]*)|здоровь[\p{L}]*|(?:лечени|исцелени)[\p{L}]*|щит[\p{L}]*|критическ[\p{L}]*)/giu;
    const pieces=[];let last=0,m;
    while((m=re.exec(text))){if(m.index>last)pieces.push({text:text.slice(last,m.index)});const v=m[0].toLowerCase();let color='#f1ce7f';
      if(v.includes('магическ'))color='#c2a0ff';else if(v.includes('физическ')||v.includes('истинн'))color='#ffad78';else if(v.startsWith('скорост'))color='#83d7f6';else if(v.startsWith('здоров')||v.startsWith('лечени')||v.startsWith('исцелени'))color='#96dfb2';else if(v.startsWith('щит'))color='#83d7f6';
      pieces.push({text:m[0],color});last=re.lastIndex;
    }
    if(last<text.length)pieces.push({text:text.slice(last)});return pieces;
  }
  function safeDescription(html){
    const normalized=normalizeDescription(html);
    const doc=new DOMParser().parseFromString(`<div>${normalized}</div>`,'text/html');
    const root=doc.body.firstElementChild;
    function copy(node){
      if(node.nodeType===Node.TEXT_NODE){const frag=doc.createDocumentFragment();automaticHighlight(node.nodeValue).forEach(part=>{if(!part.color)frag.append(doc.createTextNode(part.text));else{const mark=doc.createElement('span');mark.className='hl-custom';mark.style.color=part.color;mark.textContent=part.text;frag.append(mark)}});return frag;}
      if(node.nodeType!==Node.ELEMENT_NODE)return doc.createDocumentFragment();
      const tag=node.tagName.toLowerCase();
      if(tag==='br')return doc.createElement('br');
      if(tag==='li'){const box=doc.createElement('div');box.textContent='• ';node.childNodes.forEach(n=>box.append(copy(n)));return box}
      const span=doc.createElement(['b','strong','i','em'].includes(tag)?tag:'span');
      const cls=colorClass(node);if(cls.startsWith('custom:'))span.style.color=cls.slice(7);else if(cls)span.className='hl-'+cls;
      node.childNodes.forEach(n=>span.append(copy(n)));return span;
    }
    const out=doc.createElement('div');root.childNodes.forEach(n=>out.append(copy(n)));return out.innerHTML;
  }
  function entryImage(entry){if(state.kind==='items')return `${BASE}/cdn/${state.version}/img/item/${entry.image.full}`;if(state.kind==='runes')return `${BASE}/cdn/img/${entry.icon}`;if(state.kind==='champions')return entry.__kind==='champion'?`${BASE}/cdn/${state.version}/img/champion/${entry.image.full}`:`${BASE}/cdn/${state.version}/img/spell/${entry.image.full}`;return `${BASE}/cdn/${state.version}/img/spell/${entry.image.full}`}
  function spellCategory(spell){const id=spell.__id;if(['SummonerFlash','SummonerTeleport','SummonerHaste'].includes(id))return'movement';if(['SummonerHeal','SummonerBarrier','SummonerBoost'].includes(id))return'defense';if(id==='SummonerSmite')return'jungle';return'combat'}
  function currentData(){return state.kind==='items'?state.items:state.kind==='runes'?state.runes:state.kind==='spells'?state.spells:state.selectedChampion?state.championAbilities:state.champions}
  function renderFilters(){
    const wrap=$('filters');wrap.innerHTML='';
    const opts=state.kind==='items'?categories:state.kind==='runes'?[['all','Все руны'],...state.runeStyles.map(s=>[String(s.id),s.name])]:state.kind==='spells'?spellCategories:[];
    opts.forEach(([value,label])=>{const b=document.createElement('button');b.className='filter'+(state.filter===value?' active':'');b.dataset.filter=value;b.textContent=label;wrap.append(b)});
    wrap.hidden=state.kind==='champions';
    $('sort').style.display=state.kind==='items'?'':'none';
    const isChamp=state.kind==='champions';
    $('downloadAll').disabled=isChamp&&!state.selectedChampion;
    $('downloadAll').textContent=state.kind==='items'?'Скачать все предметы · ZIP':state.kind==='runes'?'Скачать все руны · ZIP':state.kind==='spells'?'Скачать все заклинания · ZIP':state.selectedChampion?`Скачать способности ${state.selectedChampion.name} · ZIP`:'Сначала выбери чемпиона';
